# Lightweight single-pass configuration for short personal animation previews.
# Uses the distilled 2B v0.9.6 checkpoint to avoid the extra multi-scale upscaler.
# Model weights are downloaded by the official LTX inference code on first use.
pipeline_type: base
checkpoint_path: "ltxv-2b-0.9.6-distilled-04-25.safetensors"
guidance_scale: 1
stg_scale: 0
rescaling_scale: 1
num_inference_steps: 8
stg_mode: "attention_values"
decode_timestep: 0.05
decode_noise_scale: 0.025
text_encoder_model_name_or_path: "PixArt-alpha/PixArt-XL-2-1024-MS"
precision: "bfloat16"
sampler: "from_checkpoint"
# Disable prompt enhancement so it does not download extra Florence/Llama models.
prompt_enhancement_words_threshold: 0
prompt_enhancer_image_caption_model_name_or_path: "MiaoshouAI/Florence-2-large-PromptGen-v2.0"
prompt_enhancer_llm_model_name_or_path: "unsloth/Llama-3.2-3B-Instruct"
stochastic_sampling: true
